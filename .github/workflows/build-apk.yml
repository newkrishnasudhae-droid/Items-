name: Build Product Price Book APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP and find project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -not -path "./extracted/*" \
            -print0 |
          while IFS= read -r -d '' ZIP; do
            NAME="$(basename "$ZIP" .zip)"
            mkdir -p "extracted/$NAME"
            unzip -oq "$ZIP" -d "extracted/$NAME"
          done

          if [ ! -f settings.gradle ] &&
             [ ! -f settings.gradle.kts ]; then

            PROJECT="$(
              find extracted -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              | head -n 1
            )"

            if [ -z "$PROJECT" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi

            DIR="$(dirname "$PROJECT")"
            cp -a "$DIR"/. .
          fi

          echo "Project:"
          pwd

          ls -la

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager \
              | head -n 1
            )"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Java Product class
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/productpricebook/app/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "MainActivity.java not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "app/src/main/java/com/productpricebook/app/MainActivity.java"
          )

          s = p.read_text(encoding="utf-8")

          # Fix Product class
          s = re.sub(
              r'(?m)^(\s*)class\s+Product\s*\{',
              r'\1static class Product {',
              s,
              count=1
          )

          # Fix Product.from()
          s = re.sub(
              r'\bProduct\s+from\s*\(\s*JSONObject\s+o\s*\)',
              'static Product from(JSONObject o)',
              s
          )

          # Prevent duplicate static
          s = s.replace(
              "static static Product from",
              "static Product from"
          )

          p.write_text(s, encoding="utf-8")

          print("Product class fixed.")
          PY

      - name: Fix Manifest XML
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'&(?!amp;|lt;|gt;|quot;|apos;|#[0-9]+;|#x[0-9A-Fa-f]+;)'
          )

          for p in Path(".").rglob("AndroidManifest.xml"):

              if ".git" in p.parts:
                  continue

              s = p.read_text(encoding="utf-8")
              fixed = pattern.sub("&amp;", s)

              if fixed != s:
                  p.write_text(fixed, encoding="utf-8")
                  print("Fixed:", p)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK="$(
            find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "APK not found."
            exit 1
          fi

          cp "$APK" \
            release/ProductPriceBook-debug.apk

          ls -lh release/ProductPriceBook-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProductPriceBook-APK
          path: release/ProductPriceBook-debug.apk
