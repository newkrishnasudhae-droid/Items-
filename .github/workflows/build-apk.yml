name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Extract ZIP Projects
        shell: bash
        run: |
          set -e

          mkdir -p .auto_extract

          echo "=========================================="
          echo "SEARCHING FOR ZIP FILES"
          echo "=========================================="

          found=0

          while IFS= read -r -d '' ZIP_FILE; do
            echo "Extracting: $ZIP_FILE"

            ZIP_NAME=$(basename "$ZIP_FILE" .zip)
            EXTRACT_DIR=".auto_extract/$ZIP_NAME"

            mkdir -p "$EXTRACT_DIR"

            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

            found=1
          done < <(
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -not -path "./.auto_extract/*" \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No ZIP file found."
          else
            echo "ZIP extraction completed."
          fi

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project already exists in repository."
            exit 0
          fi

          PROJECT_DIR=$(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              -not -path "./.auto_extract/*/.gradle/*" \
              -print \
              | head -n 1 \
              | xargs -r dirname
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Android project copied successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android Project
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID PROJECT CHECK"
          echo "=========================================="

          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "Project check completed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*"

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK_FILE=$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK_FILE" \
            "release/ProductPriceBook-debug.apk"

          echo "APK:"
          ls -lh release/ProductPriceBook-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProductPriceBook-APK
          path: release/ProductPriceBook-debug.apk
          if-no-files-found: error

**File path:**
```text
