name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Product Price Book APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. ANDROID SDK
      # No android-actions/setup-android
      # This avoids the sdkmanager error.
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Android SDK configured."


      # =========================================================
      # 4. EXTRACT ALL ZIP FILES AUTOMATICALLY
      # =========================================================
      - name: Auto Extract ZIP Projects
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "AUTO ZIP EXTRACTION"
          echo "=========================================="

          mkdir -p extracted

          FOUND_ZIP=0

          while IFS= read -r -d '' ZIP_FILE
          do
            echo ""
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            ZIP_NAME="$(basename "$ZIP_FILE" .zip)"

            mkdir -p "extracted/$ZIP_NAME"

            unzip -oq "$ZIP_FILE" \
              -d "extracted/$ZIP_NAME"

            FOUND_ZIP=1

          done < <(
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -not -path "./extracted/*" \
              -print0
          )

          if [ "$FOUND_ZIP" = "0" ]; then
            echo "No ZIP file found."
          else
            echo ""
            echo "ZIP extraction completed."
          fi


      # =========================================================
      # 5. FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINDING ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle" ] ||
             [ -f "settings.gradle.kts" ]; then

            echo "Android project found in repository root."

            exit 0
          fi

          PROJECT_FILE="$(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -z "$PROJECT_FILE" ]; then

            echo ""
            echo "ERROR: Android project not found."
            echo ""

            echo "Extracted files:"
            find extracted \
              -maxdepth 5 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo ""

          cp -a "$PROJECT_DIR"/. .


      # =========================================================
      # 6. FIND ALL MANIFEST FILES
      # =========================================================
      - name: Find Manifest Files
        shell: bash
        run: |
          echo "=========================================="
          echo "MANIFEST FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -not -path "./.git/*" \
            -print


      # =========================================================
      # 7. FIX INVALID XML AMPERSAND
      # =========================================================
      - name: Fix AndroidManifest XML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING XML MANIFEST FILES"
          echo "=========================================="

          python3 <<'PY'

          import os
          import re

          VALID_ENTITIES = (
              "amp;",
              "lt;",
              "gt;",
              "quot;",
              "apos;"
          )

          pattern = re.compile(
              r'&(?!amp;|lt;|gt;|quot;|apos;|#[0-9]+;|#x[0-9A-Fa-f]+;)'
          )

          for root, dirs, files in os.walk("."):

              if ".git" in root.split(os.sep):
                  continue

              for filename in files:

                  if filename != "AndroidManifest.xml":
                      continue

                  path = os.path.join(root, filename)

                  print("")
                  print("Checking:", path)

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = f.read()

                  fixed = pattern.sub("&amp;", data)

                  if fixed != data:

                      with open(
                          path,
                          "w",
                          encoding="utf-8"
                      ) as f:
                          f.write(fixed)

                      print("FIXED:", path)

                  else:
                      print("OK:", path)

          PY


      # =========================================================
      # 8. SHOW MANIFEST
      # =========================================================
      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL MANIFEST"
          echo "=========================================="

          if [ -f "app/src/main/AndroidManifest.xml" ]; then

            cat app/src/main/AndroidManifest.xml

          else

            echo "WARNING:"
            echo "app/src/main/AndroidManifest.xml not found."

            find . \
              -type f \
              -name "AndroidManifest.xml" \
              -not -path "./.git/*"

          fi


      # =========================================================
      # 9. CHECK PROJECT
      # =========================================================
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          echo "ROOT:"
          ls -la

          echo ""
          echo "APP:"
          ls -la app

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi


      # =========================================================
      # 10. SETUP GRADLE 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # =========================================================
      # 11. GRADLE VERSION
      # =========================================================
      - name: Check Gradle
        shell: bash
        run: |
          if [ -f "gradlew" ]; then

            chmod +x gradlew

            ./gradlew --version

          else

            gradle --version

          fi


      # =========================================================
      # 12. CLEAN BUILD
      # =========================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then

            chmod +x gradlew

            ./gradlew clean

          else

            gradle clean

          fi


      # =========================================================
      # 13. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          if [ -f "gradlew" ]; then

            chmod +x gradlew

            ./gradlew \
              assembleDebug \
              --stacktrace \
              --no-daemon

          else

            gradle \
              assembleDebug \
              --stacktrace \
              --no-daemon

          fi


      # =========================================================
      # 14. FIND APK
      # =========================================================
      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GENERATED APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*"


      # =========================================================
      # 15. COPY APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK_FILE="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "release/ProductPriceBook-debug.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release/ProductPriceBook-debug.apk


      # =========================================================
      # 16. UPLOAD APK
      # =========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductPriceBook-APK
          path: release/ProductPriceBook-debug.apk
          if-no-files-found: error
