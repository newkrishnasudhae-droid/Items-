name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Extract ZIP files
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            -not -path "./extracted/*" \
            -print0 |
          while IFS= read -r -d '' ZIP_FILE; do
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d extracted
          done

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found in root."
            exit 0
          fi

          PROJECT_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching files:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        shell: bash
        run: |
          set -e

          echo "===== ROOT ====="
          ls -la

          echo "===== APP ====="
          ls -la app

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" \
            release/ProductPriceBook-debug.apk

          echo "APK created:"
          ls -lh release/ProductPriceBook-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProductPriceBook-APK
          path: release/ProductPriceBook-debug.apk
          if-no-files-found: error
