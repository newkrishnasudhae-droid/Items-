name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP files
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          for zipfile in $(find . -maxdepth 3 -type f -name "*.zip" -not -path "./.git/*"); do
            echo "Extracting: $zipfile"
            unzip -oq "$zipfile" -d extracted
          done

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Project found in root."
            exit 0
          fi

          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        shell: bash
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== APP ====="
          ls -la app

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          find . -type f -name "*.apk"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" release/ProductPriceBook-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProductPriceBook-APK
          path: release/ProductPriceBook-debug.apk
